<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask SPV · Sri Pragathi Vidyaniketan</title>
<link rel="icon" href="/logo.png">
<style>
:root{--navy:#16204a;--gold:#f2a900;--bg:#f5f7fc;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#1b2340}
.shell{max-width:720px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 40px rgba(22,32,74,.12)}
header{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--navy);color:#fff}
header img{width:42px;height:42px}header b{display:block;font-size:1.1rem}header span{font-size:.8rem;color:#c9d1ec}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;font-size:.95rem}
.assistant{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
.user{background:var(--gold);color:var(--navy);align-self:flex-end;border-bottom-right-radius:4px}
.typing{color:#8a93b3;font-style:italic}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chips button{flex:none;border:1.5px solid #e4e8f2;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer;color:var(--navy)}
form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid #e4e8f2}
input{flex:1;padding:12px 14px;border:1.5px solid #e4e8f2;border-radius:999px;font:inherit}input:focus{outline:none;border-color:var(--gold)}
form button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="shell">
  <header><img src="/logo.png" alt=""><div><b>Ask SPV</b><span>Sri Pragathi Vidyaniketan · AI assistant</span></div></header>
  <main id="log"></main>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" placeholder="Type in English or తెలుగు…" autocomplete="off"><button id="send">Send</button></form>
</div>
<script>
const log=document.getElementById('log'), q=document.getElementById('q'), btn=document.getElementById('send');
const history=[]; let busy=false;
function add(role,text,cls=''){const d=document.createElement('div');d.className=`msg ${role} ${cls}`;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add('assistant','Namaste! I am Ask SPV. Ask me about admissions, the school, or our Word of the Day.');
["Today's Word of the Day","How do admissions work?","Quiz me on Tolerance","స్కూల్ ఎక్కడ ఉంది?"].forEach(s=>{
  const b=document.createElement('button');b.textContent=s;b.onclick=()=>send(s);document.getElementById('chips').appendChild(b)});
async function send(text){
  const message=(text??q.value).trim(); if(!message||busy) return;
  q.value=''; busy=true; btn.disabled=true; add('user',message);
  const t=add('assistant','Thinking…','typing');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});
    if(!r.ok) throw 0; const {reply}=await r.json();
    t.remove(); add('assistant',reply);
    history.push({role:'user',content:message},{role:'assistant',content:reply});
  }catch{t.remove();add('assistant','Sorry, I could not connect. Please try again.')}
  busy=false; btn.disabled=false; q.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
</script>
</body>
</html>
